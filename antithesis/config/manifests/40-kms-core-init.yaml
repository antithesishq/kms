    app: kms-core-client
    app.kubernetes.io/name: kms-core-client
  name: kms-core-client
  namespace: kms-threshold-staging
  annotations:
    kapp.k14s.io/change-group: kms-core-client
    kapp.k14s.io/change-rule: upsert after upserting kms-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kms-core-client
  template:
