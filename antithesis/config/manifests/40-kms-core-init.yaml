apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: kms-threshold-init-job
    app.kubernetes.io/name: kms-core-init-threshold-init
  annotations:
    kapp.k14s.io/change-group: kms-init
    kapp.k14s.io/change-rule: upsert after upserting kms-core
  name: kms-core-init-threshold-init
  namespace: kms-threshold-staging
spec:
  template:
    metadata:
      labels:
        app: kms-threshold-init-job
        app.kubernetes.io/name: kms-core-init-threshold-init
    spec:
      securityContext:
        fsGroup: 10002
        runAsGroup: 10002
        runAsNonRoot: true
        runAsUser: 10003
      initContainers:
      - name: check-kms-cores
        image: us-central1-docker.pkg.dev/molten-verve-216720/zama-repository/kms/core-service-probe:@KMS_TAG@
        command:
        - /bin/bash
        - -c
        args:
        - |
          echo "starting init process for kms-cores to be ready to be initialized"
          kmsInitCount=0
          peerAddresses=("kms-core-1-core-1:50100" "kms-core-2-core-2:50100" "kms-core-3-core-3:50100" "kms-core-4-core-4:50100" )
          for peerAddress in "${peerAddresses[@]}"; do
            while true
              do
              grpc_health_probe -addr="${peerAddress}"
              healthStatus=$?
              if [ ${healthStatus} -eq 0 ]; then
                echo "kms-core #${peerAddress} is already initialized"
                kmsInitCount=$((kmsInitCount + 1))
                break
              fi
              if [ ${healthStatus} -eq 1 ]; then
                echo "kms-core #${peerAddress} is reachable but not yet initialized"
                break
              fi;
              echo "failed to connect to kms-core at ${peerAddress}, retrying"
              sleep 1
            done
          done
          echo "all kms-core peers have been reached"
          echo "${kmsInitCount}" > /mnt/kms-init-count
        volumeMounts:
        - name: kms-core-health
          mountPath: /mnt
        imagePullPolicy: Never
      containers:
      - name: threshold-init
        image: us-central1-docker.pkg.dev/molten-verve-216720/zama-repository/kms/core-service:@KMS_TAG@
        command:
        - /bin/sh
        - -c
        args:
        - |
          KMS_INIT_COUNT="$(cat /mnt/kms-init-count)"
          KMS_INIT_TIMEOUT_SECONDS=1200
          echo "${KMS_INIT_COUNT} peers to initialize"
          timeout ${KMS_INIT_TIMEOUT_SECONDS} bin/kms-init --addresses http://kms-core-1-core-1:50100 http://kms-core-2-core-2:50100 http://kms-core-3-core-3:50100 http://kms-core-4-core-4:50100
          exit $?
        volumeMounts:
        - name: kms-core-health
          mountPath: /mnt
          readOnly: true
        imagePullPolicy: Never
      volumes:
      - name: kms-core-health
        emptyDir:
          medium: Memory
      restartPolicy: Never
  backoffLimit: 6
