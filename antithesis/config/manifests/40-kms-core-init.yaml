# The idle core-client (driver host for antithesis-workload) and the threshold-init
# Job that creates the KMS context and epoch across the four parties.
#
# Rendered from chart/kms-core with:
#   helm template kms-core-init chart/kms-core -n kms-threshold-staging --include-crds \
#     -f ../scratchbook/k8s-minimization/values/overrides.yaml \
#     -f ../scratchbook/k8s-minimization/values/peers.yaml \
#     --set kmsCore.enabled=false --set kmsInit.enabled=true \
#     --set kmsCoreClient.enabled=true --set kmsGenCertAndKeys.enabled=false
#
# Minimized for Antithesis, plus one upstream fix: the chart emits `imagePullPolicy`
# twice on the core-client container (a duplicate YAML key, from the mockEnclave patch
# adding a value-driven policy next to the stock hardcoded one). Re-serializing through
# a YAML parser collapses it.
#
# The threshold-init Job is self-ordering: its init container grpc_health_probes all
# four cores before `kms-init` runs.
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: kms-core-client
  name: kms-core-client-config
  namespace: kms-threshold-staging
data:
  load-core-client-config.sh: "#!/usr/bin/env sh\nset -e\necho \"loading configuration from env vars into the config.toml file\"\n\n# Process the S3 endpoint if it contains a variable\nif echo \"$S3_ENDPOINT\" | grep -q '\\$'; then\n    S3_ENDPOINT=$(eval echo \"$S3_ENDPOINT\")\nfi\n\nif [ -n \"${CORE_CLIENT__S3_ENDPOINT}\" ]; then\n  S3_ENDPOINT=\"${CORE_CLIENT__S3_ENDPOINT}\"\nfi\n\ncat <<EOF >>config.toml\n########################################################################\n# Config for a threshold deployment of n=4 cores with threshold t=1\n# The type of the KMS (\"centralized\" or \"threshold\")\nkms_type = \"threshold\"\n\n# The minimum number of matching responses required to have an honest majority\nnum_majority=${NUM_MAJORITY}\n\n# The minimum number of responses required to reconstruct a value (e.g. in user decryption)\nnum_reconstruct=${NUM_RECONSTRUCT}\n\n# Decryption mode used in user decryption reconstruction.\n# Options are NoiseFloodSmall and BitDecSmall.\n# Must match the deployed core/service setting!\n# Only relevant for threshold.\ndecryption_mode=${DECRYPTION_MODE}\n\n# fhe_params = \"Test\" # Small, insecure parameters for testing\nfhe_params=${FHE_PARAMETER:=Test} # Large, secure parameters\n\n# List of connection info to each of the cores\n\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 1\n# The address of the given KMS server, including the port\naddress = \"kms-core-1-core-1:50100\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p1\"\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 2\n# The address of the given KMS server, including the port\naddress = \"kms-core-2-core-2:50100\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p2\"\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 3\n# The address of the given KMS server, including the port\naddress = \"kms-core-3-core-3:50100\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p3\"\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 4\n# The address of the given KMS server, including the port\naddress = \"kms-core-4-core-4:50100\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p4\"\n    \nEOF\n\n# Keep the pod running\ntail -f /dev/null\n"
  load-core-client-testing-config.sh: "#!/usr/bin/env sh\nset -e\n\necho \"loading configuration from env vars into the config.toml file\"\n\n# Process the S3 endpoint if it contains a variable\nif echo \"$S3_ENDPOINT\" | grep -q '\\$'; then\n    S3_ENDPOINT=$(eval echo \"$S3_ENDPOINT\")\nfi\n\nif [ -n \"${CORE_CLIENT__S3_ENDPOINT}\" ]; then\n  S3_ENDPOINT=\"${CORE_CLIENT__S3_ENDPOINT}\"\nfi\n\ncat <<EOF >>config.toml\n########################################################################\n# Config for a threshold deployment of n=4 cores with threshold t=1\n# The type of the KMS (\"centralized\" or \"threshold\")\nkms_type = \"threshold\"\n\n# The minimum number of matching responses required to have an honest majority\nnum_majority=${NUM_MAJORITY}\n\n# The minimum number of responses required to reconstruct a value (e.g. in user decryption)\nnum_reconstruct=${NUM_RECONSTRUCT}\n\n# Decryption mode used in user decryption reconstruction.\n# Options are NoiseFloodSmall and BitDecSmall.\n# Must match the deployed core/service setting!\n# Only relevant for threshold.\ndecryption_mode=${DECRYPTION_MODE}\n\n# fhe_params = \"Test\" # Small, insecure parameters for testing\nfhe_params=${FHE_PARAMETER:=Test} # Large, secure parameters\n\n# List of connection info to each of the cores\n\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 1\n# The address of the given KMS server, including the port\naddress = \"kms-core-1-core-1:50001\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p1\"\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 2\n# The address of the given KMS server, including the port\naddress = \"kms-core-2-core-2:50001\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p2\"\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 3\n# The address of the given KMS server, including the port\naddress = \"kms-core-3-core-3:50001\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p3\"\n    \n\n[[cores]]\n# The ID of the given KMS server (monotonically increasing positive integer starting at 1)\nparty_id = 4\n# The address of the given KMS server, including the port\naddress = \"kms-core-4-core-4:50001\"\n# The S3 endpoint where the public material of the given server can be reached\ns3_endpoint = \"${S3_ENDPOINT}\"\n# The folder at the S3 endpoint where the data is stored\nobject_folder = \"PUB-p4\"\n    \nEOF\n"
---
