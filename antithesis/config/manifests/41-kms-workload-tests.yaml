    #!/usr/bin/env python3
    """Reshares the workload's FHE key into a new epoch of the default context. The decryption
    driver also decrypts under the epochs that this command records (pick_epoch in helper_lib.py),
    so its plaintext check covers the reshared key shares too.

    kms-core-client new-epoch sends the reshare to all four cores and polls each core for the
    result. It then checks that every result names the key and preprocessing IDs that were sent,
    and that the signature of every result verifies over the published key material. The CLI
    succeeds only when all four cores report success, but the protocol tolerates one faulty party.
    A failed run can therefore leave an epoch that some cores hold and others do not. Such an epoch
    is recorded as unconfirmed, and the decryption driver tries it less often.

    This is an anytime command. It runs alongside the decryption drivers, as an operator's reshare
    would, and copies of it can run at the same time. Each run uses a fresh epoch ID.
    """

    import sys

    import helper_lib as h  # first: it sets up the SDK's output before the SDK loads
    from antithesis.assertions import always, reachable

    h.declare_catalog()

    key = h.find_reshare_key()
    if key is None:
        print("no key with a recorded preprocessing ID; run first_generate_key.py first, or record")
        print(f"a key generated by hand with: echo <preproc_id> >{h.STATE_DIR}/preproc/<key_id>")
        sys.exit(0)
    key_id, preproc_id = key

    # The source epoch is the kms-init epoch, or an epoch that an earlier reshare created.
    source_epoch = h.DEFAULT_EPOCH_ID
    if h.pick("default", "chained") == "chained":
        chained = h.epochs_of(key_id, "confirmed")
        if chained:
            source_epoch = h.pick(*chained)
    new_epoch = h.new_epoch_id()

    h.enter_scratch_dir()

    # The request carries the digests of the key's public material, and every core compares them
    # with its own copy before it takes part. Party 1's copy in MinIO is the reference.
    digest_field = "xof_key_digest"
    keyset = h.fetch(f"{h.S3_PUBLIC}/PUB-p1/CompressedXofKeySet/{key_id}")
    if keyset is None:
        digest_field = "server_key_digest"
        keyset = h.fetch(f"{h.S3_PUBLIC}/PUB-p1/ServerKey/{key_id}")
    if keyset is None:
        print(f"cannot read the key material of {key_id} from MinIO; no reshare this time")
        sys.exit(0)
    public_key = h.fetch(f"{h.S3_PUBLIC}/PUB-p1/PublicKey/{key_id}")
    if public_key is None:
        print(f"cannot read the public key of {key_id} from MinIO; no reshare this time")
        sys.exit(0)

    previous = (
        f"context_id:{h.DEFAULT_CONTEXT_ID};epoch_id:{source_epoch};"
        f"previous_keys:[key_id={key_id},preproc_id={preproc_id},"
        f"{digest_field}={h.key_digest(keyset)},public_key_digest={h.key_digest(public_key)}]"
    )

    # --max-iter counts 0.5 s result polls per core.
    args = ["-f", "config.toml", "--max-iter", "1200", "new-epoch", "--new-epoch-id", new_epoch,
            "--new-context-id", h.DEFAULT_CONTEXT_ID, "--previous-epoch-params", previous]
    rc, output = h.run_cli(args, timeout=900)

    inputs = {
        "key_id": key_id,
        "preproc_id": preproc_id,
        "source_epoch": source_epoch,
        "new_epoch": new_epoch,
        "digest_field": digest_field,
        "exit_code": rc,
    }

    # Errors that the CLI raises only after every core reported the reshare as done: a result names
    # another key or preprocessing ID, or its signature does not verify over the published key
    # material. Source: do_new_epoch in core-client/src/mpc_epoch.rs.
    WRONG_RESULT = [
        "Resharing response did not contain the expected",
        "No resharing response found",
        "Signature verification failed for the reshared key",
    ]

    if rc == 0 and "New epoch created" in output:
        h.record_epoch(new_epoch, key_id, "confirmed")
        always(True, "key reshare result from every KMS party matches the reshared key", inputs)
        if source_epoch != h.DEFAULT_EPOCH_ID:
            reachable("key reshare succeeded from an epoch that a reshare created", inputs)
        sys.exit(0)

    err = h.first_line_with(output, WRONG_RESULT)
    if err is not None:
        # The cores consider the epoch done, so decryptions under it are worth a try as well.
        h.record_epoch(new_epoch, key_id, "unconfirmed")
        always(
            False,
            "key reshare result from every KMS party matches the reshared key",
            {**inputs, "error": h.clip(err)},
        )
        print(output)
        sys.exit(1)

    # The CLI's argument parser exits with 2, so this script built a malformed command.
    if rc == 2:
        print("kms-core-client rejected the arguments")
        print(output)
        sys.exit(1)

    # Any other failure is a reshare that did not finish everywhere: a core was down, slow or cut
    # off, or it rejected the request. The CLI reports a failed reshare as a panic, and the gRPC
    # status carries only the code. The epoch is kept, because the other cores can complete it.
    h.record_epoch(new_epoch, key_id, "unconfirmed")
    lines = output.splitlines()
    panic = next((i for i, line in enumerate(lines) if "panicked at" in line), None)
    err = "\n".join(lines[panic:panic + 3]) if panic is not None else h.tail(output, 3)
    reachable("key reshare attempt ended without a verdict", {**inputs, "error": h.clip(err)})
    print(h.tail(output, 20))
    sys.exit(0)
  first_generate_key.py: |
    #!/usr/bin/env python3
    """Generates the FHE key that the drivers decrypt under and reshare. kms-init creates only the
    MPC context and epoch, so a fresh cluster has no key.

    Antithesis runs this once per timeline, before any driver and with no faults. The default is
    insecure keygen because it is fast. Set KMS_WORKLOAD_KEYGEN=secure to run the real distributed
    keygen instead.
    """

    import os
    import sys
    import time

    import helper_lib as h  # first: it sets up the SDK's output before the SDK loads
    from antithesis.assertions import reachable

    h.declare_catalog()
    h.enter_scratch_dir()

    if os.environ.get("KMS_WORKLOAD_KEYGEN", "insecure") == "secure":
        preproc_cmd, keygen_cmd = "preproc-key-gen", "key-gen"
    else:
        preproc_cmd, keygen_cmd = "insecure-preproc-key-gen", "insecure-key-gen"

    # --max-iter counts 0.5 s result polls; keygen can take minutes.
    common = ["-f", "config.toml", "--max-iter", "1200"]
    for attempt in range(1, 6):
        print(f"attempt {attempt}: kms-core-client {preproc_cmd}, then {keygen_cmd}")
        rc, output = h.run_cli([*common, preproc_cmd])
        preproc_id = h.request_id_from(output) if rc == 0 else None
        if preproc_id:
            rc, output = h.run_cli([*common, keygen_cmd, "--preproc-id", preproc_id])
            key_id = h.request_id_from(output) if rc == 0 else None
            if key_id:
                print(f"generated key {key_id} (preproc {preproc_id})")
                h.record_preproc(key_id, preproc_id)  # anytime_reshare_key.py needs it
                reachable(
                    "workload generated an FHE key",
                    {"key_id": key_id, "keygen": keygen_cmd, "attempt": attempt},
                )
                sys.exit(0)
        print(h.tail(output, 5))
        time.sleep(10)
    print("keygen failed 5 times")
    sys.exit(1)
  helper_lib.py: |
    """Shared helpers for the public_decrypt test template. Imported by the test commands; the
    helper_ prefix makes Antithesis skip this file when it picks commands to run.

    Assertions and randomness come from the Antithesis Python SDK, which images/client.Dockerfile
    installs in the core-client image. In Antithesis the SDK reports through libvoidstar. Without
    libvoidstar it writes JSON lines to $ANTITHESIS_SDK_LOCAL_OUTPUT, which this module points at
    $ANTITHESIS_OUTPUT_DIR/sdk.jsonl when that is set, and at /tmp/antithesis-sdk.jsonl otherwise
    (hand-driving with kubectl exec).

    Import this module before anything from antithesis: the SDK picks its output when it loads.
    """

    import atexit
    import hashlib
    import http.client
    import os
    import re
    import shutil
    import subprocess
    import sys
    import tempfile
    import urllib.request
    from dataclasses import replace

    if os.environ.get("ANTITHESIS_OUTPUT_DIR"):
        _local_output = os.path.join(os.environ["ANTITHESIS_OUTPUT_DIR"], "sdk.jsonl")
    else:
        _local_output = "/tmp/antithesis-sdk.jsonl"
    os.environ.setdefault("ANTITHESIS_SDK_LOCAL_OUTPUT", _local_output)

    # A command that Antithesis kills mid-run still leaves its output so far in the logs.
    sys.stdout.reconfigure(line_buffering=True)

    from antithesis import catalog  # noqa: E402
    from antithesis.random import get_random, random_choice  # noqa: E402

    TEMPLATE_DIR = os.path.dirname(os.path.abspath(__file__))
    CLIENT_DIR = "/app/kms-core-client"  # config.toml is written here when the pod starts
    S3_PUBLIC = "http://minio:9000/kms-public"

    # State that the test commands share. All of them run in the kms-core-client container, so a
    # directory in its /tmp is enough. The state is lost when the container restarts.
    #   preproc/<key_id>  the preprocessing ID of the key (written by first_generate_key.py)
    #   epochs            one line per reshare: <epoch_id> <key_id> confirmed|unconfirmed
    STATE_DIR = "/tmp/kms-workload-state"
    EPOCHS_FILE = os.path.join(STATE_DIR, "epochs")

    # The context and epoch that kms-init creates (DEFAULT_MPC_CONTEXT and DEFAULT_EPOCH_ID in
    # core/service/src/consts.rs). A request with no epoch ID goes to this epoch.
    DEFAULT_CONTEXT_ID = "0700000000000000000000000000000000000000000000000000000000000001"
    DEFAULT_EPOCH_ID = "0800000000000000000000000000000000000000000000000000000000000001"


    def declare_catalog():
        """Declare every assertion in the template, so that a never-reached Always or Reachable
        still shows up as failing.

        The platform catalogs only Python files that are in the image, and these come from a
        ConfigMap. So each command scans the template at startup and declares what it finds,
        the way an instrumented process declares its catalog. The scan sees only SDK assertion
        calls with a literal message, so the commands spell their messages out at each call.
        """
        catalog.register(
            replace(a, location=replace(a.location, file=os.path.join(TEMPLATE_DIR, a.location.file)))
            for a in catalog.scan_tree(TEMPLATE_DIR)
        )


    def pick(*choices):
        """One of CHOICES, chosen by Antithesis. Repeat a choice to weight it."""
        return random_choice(list(choices))


    def random_hex(n):
        """N random bytes from Antithesis, as hex."""
        out = b""
        while len(out) < n:
            out += get_random().to_bytes(8, "little")
        return out[:n].hex()


    def pick_value(data_type):
        """A little-endian hex value for DATA_TYPE (as kms-core-client --to-encrypt reads it), drawn
        from the type's value menu: zero, one, the maximum, only the top bit set, or uniformly random
        bits. Random values keep requests distinguishable from each other."""
        if data_type == "ebool":
            return pick("00", "01")
        n = int(data_type[len("euint"):]) // 8
        kind = pick("zero", "one", "max", "top", "random", "random")
        if kind == "zero":
            return "00" * n
        if kind == "one":
            return "01" + "00" * (n - 1)
        if kind == "max":
            return "ff" * n
        if kind == "top":
            return "00" * (n - 1) + "80"
        return random_hex(n)


    def fetch(url):
        """The body at URL, or None when it cannot be read."""
        try:
            with urllib.request.urlopen(url, timeout=60) as response:
                return response.read()
        except (OSError, http.client.HTTPException):
            return None


    def find_key_id():
        """The ID of an FHE key that party 1 has published, at random if there are several. Keys
        are looked up in MinIO rather than a local file, so a key generated by hand is found too.
        None when there is none (or MinIO is unreachable)."""
        listing = fetch(f"{S3_PUBLIC}?list-type=2&prefix=PUB-p1/PublicKey/")
        if listing is None:
            return None
        ids = re.findall(r"<Key>PUB-p1/PublicKey/([^<]*)</Key>", listing.decode(errors="replace"))
        return random_choice(ids) if ids else None


    def request_id_from(output):
        """The request ID from kms-core-client's success line, <msg> - "request_id": "<id>"."""
        ids = re.findall(r'"request_id": "([0-9a-fA-F]*)"', output)
        return ids[-1] if ids and ids[-1] else None


    def enter_scratch_dir():
        """cd into a fresh directory holding a copy of config.toml. The CLI downloads key material
        into ./keys on every run, so concurrent runs sharing a directory would overwrite each
        other's files."""
        scratch = tempfile.mkdtemp(prefix="kms-workload.")
        atexit.register(shutil.rmtree, scratch, ignore_errors=True)
        shutil.copy(os.path.join(CLIENT_DIR, "config.toml"), scratch)
        os.chdir(scratch)


    def run_cli(args, timeout=None):
        """Run kms-core-client with ARGS. Returns its exit code and its output (stdout and stderr).
        A run that outlasts TIMEOUT seconds is stopped and exits 124, as under timeout(1)."""
        print("kms-core-client " + " ".join(args))
        with tempfile.TemporaryFile() as out:
            proc = subprocess.Popen(["kms-core-client", *args], stdout=out, stderr=subprocess.STDOUT)
            try:
                rc = proc.wait(timeout)
            except subprocess.TimeoutExpired:
                proc.terminate()
                try:
                    proc.wait(10)
                except subprocess.TimeoutExpired:
                    proc.kill()
                    proc.wait()
                rc = 124
            out.seek(0)
            return rc, out.read().decode(errors="replace")


    def first_line_with(output, patterns):
        """The first line of OUTPUT that contains one of PATTERNS, or None."""
        for line in output.splitlines():
            if any(p in line for p in patterns):
                return line
        return None


    def tail(output, n):
        return "\n".join(output.splitlines()[-n:])


    def clip(text):
        """TEXT as one line of printable ASCII, capped in length: error output is just context for
        triage."""
        text = text.translate(str.maketrans("\n\r\t", "   "))
        return "".join(c for c in text if " " <= c <= "~")[:400]


    def record_preproc(key_id, preproc_id):
        """Remember the preprocessing ID of a key. A reshare request must carry the ID that the key
        was generated from, and no public object records it."""
        os.makedirs(os.path.join(STATE_DIR, "preproc"), exist_ok=True)
        with open(os.path.join(STATE_DIR, "preproc", key_id), "w") as f:
            f.write(preproc_id + "\n")


    def find_reshare_key():
        """(key_id, preproc_id) for a key with a recorded preprocessing ID, at random if there are
        several. None when there is none."""
        try:
            keys = sorted(os.listdir(os.path.join(STATE_DIR, "preproc")))
        except FileNotFoundError:
            return None
        if not keys:
            return None
        key_id = random_choice(keys)
        with open(os.path.join(STATE_DIR, "preproc", key_id)) as f:
            return key_id, f.read().strip()


    def record_epoch(epoch_id, key_id, status):
        """Record a reshare, STATUS confirmed or unconfirmed. One short line, appended with a single
        write, so lines from concurrent commands do not mix."""
        os.makedirs(STATE_DIR, exist_ok=True)
        with open(EPOCHS_FILE, "a") as f:
            f.write(f"{epoch_id} {key_id} {status}\n")


    def epochs_of(key_id, status):
        """The recorded epochs with STATUS that KEY_ID was reshared into."""
        try:
            with open(EPOCHS_FILE) as f:
                return [fields[0] for fields in map(str.split, f) if fields[1:] == [key_id, status]]
        except FileNotFoundError:
            return []


    def pick_epoch(key_id):
        """(epoch_id, status) for a public decryption under KEY_ID. STATUS is default (the kms-init
        epoch), confirmed (every core reported the reshare as done) or unconfirmed (the reshare CLI
        failed, so some cores can hold the epoch and others not). Falls back to the default epoch
        when no reshared epoch of the chosen kind exists."""
        status = pick("default", "default", "confirmed", "confirmed", "unconfirmed")
        if status != "default":
            epochs = epochs_of(key_id, status)
            if epochs:
                return random_choice(epochs), status
        return DEFAULT_EPOCH_ID, "default"


    def new_epoch_id():
        """A random epoch ID. It starts with 0x08 like DEFAULT_EPOCH_ID, which is the prefix that
        fhevm expects."""
        return "08" + random_hex(31)


    def key_digest(data):
        """The digest that the KMS takes of a public key object. It is the 32-byte SHAKE-256 of the
        PDAT_KEY domain separator followed by the object's bytes as stored in MinIO (hash_versioned
        in core/threshold-hashing/src/lib.rs, DSEP_PUBDATA_KEY)."""
        return hashlib.shake_256(b"PDAT_KEY" + data).hexdigest(32)
  parallel_driver_public_decrypt.py: |
    #!/usr/bin/env python3
    """Runs one public decryption of a fresh value and turns the outcome into assertions.

    kms-core-client does the checking. It encrypts the value under the cluster's public key and
    sends the request to all four cores. It collects 2 responses (all 4 with -a) and checks their
    signatures, their agreement and their request link. It then compares every collected plaintext
    with the encrypted value. This script picks the inputs at random and classifies the exit of the
    CLI. A wrong result is a property failure. Any other error is a transient failure, which is
    expected under faults.

    Until anytime_reshare_key.py reshares the key, every run decrypts under the kms-init epoch.
    After that, up to 3 runs in 5 decrypt under a reshared epoch instead (see pick_epoch), so the
    same check covers the shares that a reshare produced.
    """

    import sys

    import helper_lib as h  # first: it sets up the SDK's output before the SDK loads
    from antithesis.assertions import always, reachable, unreachable

    h.declare_catalog()

    key_id = h.find_key_id()
    if key_id is None:
        print("no FHE key published in MinIO yet; nothing to decrypt")
        sys.exit(0)

    epoch_id, epoch_status = h.pick_epoch(key_id)
    data_type = h.pick("ebool", "euint8", "euint16", "euint32", "euint64", "euint128", "euint160", "euint256")
    value = h.pick_value(data_type)
    batch = h.pick(1, 1, 1, 2, 3)
    all_parties = h.pick(False, False, True)
    sync = h.pick(False, True)
    no_compression = h.pick(False, False, False, True)
    no_sns = h.pick(False, False, False, True)

    # --max-iter counts 0.5 s result polls per party.
    args = ["-f", "config.toml", "--max-iter", "120"]
    if all_parties:
        args.append("-a")
    args += ["public-decrypt", "from-args", "--to-encrypt", f"0x{value}", "--data-type", data_type,
             "--key-id", key_id, "--batch-size", str(batch)]
    if epoch_status != "default":
        args += ["--context-id", h.DEFAULT_CONTEXT_ID, "--epoch-id", epoch_id]
    if sync:
        args.append("--sync")
    if no_compression:
        args.append("--no-compression")
    if no_sns:
        args.append("--no-precompute-sns")

    h.enter_scratch_dir()
    rc, output = h.run_cli(args, timeout=300)

    inputs = {
        "data_type": data_type,
        "value_hex": value,
        "batch": batch,
        "all_parties": all_parties,
        "sync": sync,
        "no_compression": no_compression,
        "no_precompute_sns": no_sns,
        "key_id": key_id,
        "epoch_id": epoch_id,
        "epoch_status": epoch_status,
        "exit_code": rc,
    }

    # Errors that the CLI raises only when a validly signed response carries a wrong plaintext, a
    # wrong plaintext count or type, or a wrong request ID. Sources: the plaintext check in
    # core-client/src/decrypt.rs and validate_public_decrypt_responses in
    # core/service/src/engine/validation_non_wasm.rs.
    WRONG_RESULT = [
        "decryption result mismatch",
        "Cannot find public decryption pivot",
        "Not enough agreeing public decryption responses",
        "The number of ciphertexts in the public decryption response is wrong",
        "Plaintext type mismatch in public decryption response",
        "The public decryption response is not linked to the correct public decryption request",
        "Request ID is not set in public decryption response",
    ]

    if rc == 0:
        details = {**inputs, "request_id": h.request_id_from(output) or ""}
        always(True, "public decryption response carries the encrypted plaintext", details)
        if all_parties:
            reachable("public decryption succeeded with every party's response checked", details)
        if sync:
            reachable("public decryption succeeded through the sync endpoint", details)
        if batch > 1:
            reachable("batched public decryption succeeded", details)
        if no_sns:
            reachable("public decryption succeeded with SnS left to the cores", details)
        if epoch_status != "default":
            reachable("public decryption succeeded under a reshared epoch", details)
        sys.exit(0)

    err = h.first_line_with(output, WRONG_RESULT)
    if err is not None:
        always(
            False,
            "public decryption response carries the encrypted plaintext",
            {**inputs, "error": h.clip(err)},
        )
        print(output)
        sys.exit(1)

    # A response that fails authentication never comes from a correct party. One case is a
    # response for another request, whose signature does not cover this request's handles.
    err = h.first_line_with(output, ["Not enough authenticated public decryption responses"])
    if err is not None:
        unreachable(
            "public decryption response from a KMS party fails authentication",
            {**inputs, "error": h.clip(err)},
        )
        print(output)
        sys.exit(1)

    reachable(
        "public decryption attempt ended without a verdict",
        {**inputs, "error": h.clip(h.tail(output, 3))},
    )
    print(h.tail(output, 20))
    sys.exit(0)
